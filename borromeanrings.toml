# borromeanRings policy spine — the single source of declared invariants for this repo.
# Declared once here, enforced on every gate run (config-compliance: every required
# check must produce a pass receipt). See docs/specs/SPEC-spine.md and docs/adr/0010-*.md.

[project]
# What borromeanRings targets in THIS governed project (portability — see ADR-0013).
language = "python"  # selects checks/python/ (+ checks/shared/); see ADR-0015
package = "meta_harness"
src_dir = "src"
tests_dir = "tests"

[git]
# Declared commit identity (the maintainer's — configurable, NOT a contributor
# requirement). On THIS public repo, identity is enforced by the local PreToolUse guard
# ONLY: 06_git_identity is deliberately omitted from [checks].required below, so external
# contributors commit under their own identity and still pass CI. The guard stays a local
# aid for whoever has borromeanRings installed. Empty/absent ⇒ guard off too. Other projects
# may still require 06_git_identity. See docs/specs/SPEC-git-identity.md and
# docs/adr/0019-git-identity-local-guard-only-public-repo.md.
name = "wimaan3"
email = "imaansoltan@gmail.com"

[layout]
# File-organization conventions, enforced by check 07_layout (fail-closed). Each
# rule is opt-in (empty/zero ⇒ off). See docs/specs/SPEC-layout.md and ADR-0018.
specs_dir = "docs/specs"                                # every SPEC*.md must live here
root_doc_allowlist = ["README.md", "AGENTS.md", "PLAN-v0.md", "CHANGELOG.md"]  # the only .md allowed at repo root
test_grouping_threshold = 15                            # > N flat test files ⇒ group by type (grouped into unit/integration/e2e)
test_groups = ["unit", "integration", "e2e"]

[architecture]
# Import-direction fitness over the internal module graph, enforced by check
# 35_architecture (native stdlib-ast; no external tool). Codifies the acyclic,
# information-hiding architecture in docs/ARCHITECTURE.md as executable rules.
# Each rule is opt-in (empty/false ⇒ off). See SPEC-architecture.md and ADR-0027.
leaves = ["spine"]           # the config foundation (Single Choice) imports no domain module
private = ["deep_research"]  # the research testbed must stay non-load-bearing (nothing imports it)
forbid_cycles = true         # ARCHITECTURE.md §2: source → check → receipt, acyclic, no feedback

[changelog]
# Keep a Changelog discipline, enforced by check 11_changelog. presence + an
# 'Unreleased' section is on now (non-retroactive: it constrains repo state, not a
# diff). The strict "update the changelog when source changes" rule is now ON
# (the enforcement-coverage PR queue has merged). See SPEC-changelog.md, ADR-0028.
enabled = true
path = "CHANGELOG.md"
require_entry_on_src_change = true

[critic]
# T2 external rubric critic (ADR-0023/0030). judge_command is the model judge the
# critic checks (e.g. 55_doc_drift, advisory) shell out to — it receives a prompt on
# stdin and returns a yes/no answer on stdout (e.g. "claude -p"). Empty ⇒ the critic
# checks are OFF (no live judge wired). Left empty here: doc-drift is advisory and
# belongs on the CI heavy lane before a live model judge runs on every gate.
judge_command = ""
# Wave-2 rubrics enabled (dormant until judge_command is set). ADR-0036.
rubrics = ["error_handling", "naming", "security", "boundary_value", "test_smell"]

[audit]
# Dependency CVE audit (heavy check 70_pip_audit). Ignore base packaging
# tooling (not declared deps) and any explicitly-accepted advisories. ADR-0034.
ignore_packages = ["pip", "setuptools", "wheel"]
ignore_vulns = []

[licenses]
# Dependency license compliance (heavy check 72_licenses). Deny copyleft that
# is incompatible with Apache-2.0 distribution; allow_packages exempts vetted
# deps. Off when deny is empty. ADR-0035.
deny = ["GPL-2", "GPL-3", "GPLv2", "GPLv3", "AGPL", "Affero", "SSPL", "GNU General Public"]
allow_packages = []

[collaboration]
# Tier A collaboration gates (Gitflow-lite; SPEC-collaboration.md, ADR-0021).
# Each rule is opt-in (empty/zero ⇒ off). Enforced by checks 08_branch and
# 09_commits + the protected-branch guard in pre_bash_guard.sh.
protected_branches = ["main", "dev"]
branch_patterns = [
  "feat/*", "feature/*", "fix/*", "docs/*",
  "chore/*", "refactor/*", "perf/*", "test/*", "ci/*", "hotfix/*",
]
commit_types = ["feat", "fix", "refactor", "docs", "test", "chore", "perf", "ci"]
subject_max_length = 72

[container]
# Container (Dockerfile) hygiene, enforced by check 14_container (matrix #4, SRE).
# Off unless 14_container is in [checks].required. borromeanRings's own image is a
# run-and-exit gate-runner (CMD runs verify.sh, then exits) — there's no long-lived
# service to probe, so `healthcheck` is deliberately omitted; a service project keeps
# the full default set ["non_root", "pinned_base", "healthcheck"]. See SPEC-container.md,
# ADR-0044.
dockerfile = "Dockerfile"
require = ["non_root", "pinned_base"]

[verification]
# The mathematical-verification ladder (tier 1 of 3; SPEC-verification-ladder.md, ADR-0074).
# `properties` is the project-relative directory holding the property suite that check
# 27_properties runs. There is NO default — writing the key is an affirmative claim, so an
# empty value means the tier is OFF, and a declared directory with no property tests FAILS
# (a verification claim with no evidence is the vacuity ADR-0049 exists to catch). An
# unknown key under [verification] fails config loading closed, so a typo can't silently
# switch the rule off. borromeanRings declares none yet: 27_properties reports `noop` here
# (rule off), and no property suite was invented to make it look busy. Tiers 2 (SMT) and 3
# (formal proof) are specified, not built — see the SPEC and issues #204 / #205.
properties = ""

[checks]
# The required check set (replaces checks/manifest.json as the single source of truth).
required = [
  "00_build",
  "01_source_coherence",
  "05_hygiene",
  # 06_git_identity intentionally omitted: this public repo enforces identity via the
  # local guard only, so external contributors pass CI. See [git] above + ADR-0019.
  "07_layout",
  "08_branch",
  "09_commits",
  "13_adr",
  "14_container",
  "12_secrets",
  "11_changelog",
  "10_format",
  "20_lint",
  "27_properties",
  "30_typecheck",
  "32_complexity",
  "33_coupling",
  "35_architecture",
  "40_test",
  "45_docstrings",
  "50_security",
]
# Heavy (CI-tier) checks — required ONLY under `verify.sh --heavy` (CI). Populated as
# tool-checks land (mutation, pip-audit, gitleaks, licenses). See ADR-0033.
heavy = [
  "60_mutation",
  "70_pip_audit",
  "72_licenses",
  "74_secret_history",
]

[hygiene]
# The engineering surround this project must have (presence-gated; see ADR-0012).
# borromeanRings enforces these the same way it enforces code quality.
requires = [
  "README.md",
  "LICENSE",
  "AGENTS.md",
  "pyproject.toml",
  "verify.sh",
  "docs",
  ".github/workflows",
  "Dockerfile",
]

[context]
# Declared operating context. borromeanRings surfaces this to the wrapped agent (e.g. for prompt
# rewriting — the next build) so the user's intent is preserved and improved per the declared
# context, every run. Declaring it here applies it consistently instead of restating it ad hoc.
account = "3MagicLabs/borromeanrings"
# Value priorities guide trade-offs, highest first. Consumed by prompt rewriting.
value_priorities = ["correctness", "security", "maintainability", "performance"]

[prompt_rewriting]
# When enabled, borromeanRings's UserPromptSubmit hook injects a directive asking the wrapped
# agent to rewrite the user's prompt (preserve+improve intent) using the context above, and to
# OPEN its reply with a one-line "Reading this as: ..." rendering of the improved request
# (confirmation-first only for irreversible or scope-changing readings). The agent performs
# the rewrite; verifying compliance is tracked in issue #81. See SPEC-prompt-rewrite.md.
enabled = true

[enhancements]
# Agent-enhancement recommender (advisory; ADR-0037). Categories of open-source
# tools to surface for improving the WRAPPED agent (not the code). Advisory only
# — proposes, never gates. Run: python3 -c "from meta_harness.enhancements import
# main; print(main())"
interests = ["model-routing", "observability"]
