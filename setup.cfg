# mutmut (heavy T1 mutation ratchet, checks/ci/60_mutation.sh) reads its config
# from setup.cfg's [mutmut] section. Kept minimal: mutate borromeanRings's own package.
# The score is ratcheted (non-regression) — see docs/ENFORCEMENT-COVERAGE.md, ADR-0022.
[mutmut]
source_paths = src/meta_harness/
# Run only the pure-logic tests: the 3 shell-integration tests below drive bash
# checks/hooks via repo-relative paths that don't exist in mutmut's copied
# `mutants/` working dir (they'd fail the clean-test run and evaluate 0 mutants).
# They cover shell scripts, not Python, so excluding them loses no mutant coverage.
pytest_add_cli_args_test_selection =
  --ignore=tests/integration/test_check_timeout.py
  --ignore=tests/integration/test_hook_stdin_timeout.py
  --ignore=tests/integration/test_hook_dedupe.py
  --ignore=tests/integration/test_gate_adversarial.py
  --ignore=tests/integration/test_hook_force_push.py
  --ignore=tests/integration/test_critic_judge.py
  --ignore=tests/integration/test_example_governed.py
  --ignore=tests/integration/test_harness_version_stamp.py
  --ignore=tests/integration/test_source_coherence_gate.py
  --ignore=tests/integration/test_shellcheck_gate.py
  --ignore=tests/integration/test_merge_project_scope.py
# hook_dedupe.py's only test is the excluded shell test → don't mutate it (every
# mutant would trivially survive and depress the score for no real signal).
do_not_mutate =
  src/meta_harness/hook_dedupe.py
