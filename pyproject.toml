[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-harness"
version = "0.0.0"
description = "borromeanRings — a model- and harness-agnostic meta-harness that enforces engineering standards as deterministic gates."
requires-python = ">=3.10"

[project.optional-dependencies]
# The check toolchain. Installed in CI via `pip install -e ".[dev]"` so the gate
# runs the same checks on GitHub's servers as it does locally.
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "mutmut>=3",
  "pip-licenses>=5",
  # Test-only ORACLE, never imported by the harness itself: a spec-conformant HTML5
  # tree builder that tests/unit/test_accessibility_conformance.py parses each fixture
  # with, so 15_a11y's namespace rules are *derived* from a real parser instead of
  # recited from the spec (three reviews running, reciting got them wrong). MIT.
  # PINNED, not floored: this one decides test outcomes, and how a parser treats
  # malformed markup is exactly what moves between releases — a floored oracle could
  # disagree with itself between a laptop and CI, and the conformance suite would be
  # what broke. See ADR-0077 (pin the toolchain).
  "html5lib==1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["cs130", ".meta-harness", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
branch = true
