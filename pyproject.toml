[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-harness"
version = "0.0.0"
description = "borromeanRings — a model- and harness-agnostic meta-harness that enforces engineering standards as deterministic gates."
requires-python = ">=3.10"

[project.optional-dependencies]
# The check toolchain. Installed in CI via `pip install -e ".[dev]"` so the gate
# runs the same checks on GitHub's servers as it does locally.
# Pinned exactly, not floored. A floor (or an upper bound at the next major) still
# lets a MINOR release change a verdict: ruff 0.15.8 -> 0.16.7 reformats files, so a
# green laptop and a red CI were the same commit. The gate's toolchain is part of the
# gate. constraints-dev.txt pins the rest of the closure; ADR-0077 has the evidence.
dev = [
  "ruff==0.15.8",
  "mypy==1.19.1",
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "bandit==1.9.4",
  "pip-audit==2.10.0",
  "mutmut==3.6.0",
  "pip-licenses==5.5.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["cs130", ".meta-harness", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
branch = true
